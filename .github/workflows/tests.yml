name: Research controls
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  controls:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.fullstudy.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest -q
      - run: python scripts/verify_saved_results.py --output verification/ci-saved-results.json
