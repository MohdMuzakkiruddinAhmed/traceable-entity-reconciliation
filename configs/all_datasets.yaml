version: 4
classification: exploratory_scope_expansion_requested_by_user
datasets: [WWI, WDC, Olist, DataCo, BPI2019]
seeds: [17, 29, 43]
split_seed: 20261012
exclude: [E6_human_study]
matching_scope:
